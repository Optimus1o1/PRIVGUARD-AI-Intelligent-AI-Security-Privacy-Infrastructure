# ==============================================================================
# PRIVGUARD AI - Pull Request & Protected Branch CI Workflow
# Moon Sanctum Labs - Decode. Build. Evolve.
# ==============================================================================

name: "PRIVGUARD CI"

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Test, Static Analysis & Vulnerability Scanning
  # ----------------------------------------------------------------------------
  backend:
    name: "Backend Security & Quality Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: "Set up Python 3.12"
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: "Install dependencies reproducibly"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit ruff bandit cyclonedx-bom

      - name: "Dependency vulnerability audit (pip-audit)"
        run: |
          pip-audit -r backend/requirements.txt

      - name: "Code linting verification (Ruff)"
        run: |
          ruff check backend/app

      - name: "Code formatting verification (Ruff)"
        run: |
          ruff format --check backend/app

      - name: "Static AST security analysis (Bandit)"
        run: |
          bandit -r backend/app -ll -ii

      - name: "Run test suite with coverage (Pytest)"
        env:
          ENVIRONMENT: "testing"
          DEBUG: "false"
        run: |
          pytest backend/tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: "Validate database migration consistency (Alembic)"
        run: |
          alembic check

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Quality, Build & Dependency Audit
  # ----------------------------------------------------------------------------
  frontend:
    name: "Frontend Security & Build Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: "Set up Node.js 20"
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: "Install dependencies reproducibly"
        working-directory: frontend
        run: |
          npm ci

      - name: "Dependency vulnerability audit (npm audit)"
        working-directory: frontend
        run: |
          npm audit --audit-level=high

      - name: "TypeScript static type validation"
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: "ESLint code quality check"
        working-directory: frontend
        run: |
          npm run lint

      - name: "Next.js standalone production build"
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: "production"
        run: |
          npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Infrastructure, Container & Helm Validation
  # ----------------------------------------------------------------------------
  infrastructure:
    name: "Infrastructure & Deployment Configuration Gates"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout source code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: "Set up Helm"
        uses: azure/setup-helm@b7246b12e77f7134765d507119f390886e0018b1 # v4.3.0
        with:
          version: "v3.14.0"

      - name: "Validate Docker Compose base configuration"
        run: |
          docker compose config -q

      - name: "Validate Docker Compose production configuration"
        run: |
          docker compose -f compose.yaml -f compose.production.yaml config -q

      - name: "Validate Docker Compose observability configuration"
        run: |
          docker compose -f compose.yaml -f compose.observability.yaml config -q

      - name: "Lint Helm chart"
        run: |
          helm lint deploy/helm/privguard

      - name: "Verify Helm template rendering (Development Profile)"
        run: |
          helm template privguard deploy/helm/privguard -f deploy/helm/privguard/values/development.yaml > /dev/null

      - name: "Verify Helm template rendering (Staging Profile)"
        run: |
          helm template privguard deploy/helm/privguard -f deploy/helm/privguard/values/staging.yaml > /dev/null

      - name: "Verify Helm template rendering (Production Profile)"
        run: |
          helm template privguard deploy/helm/privguard -f deploy/helm/privguard/values/production.yaml > /dev/null

