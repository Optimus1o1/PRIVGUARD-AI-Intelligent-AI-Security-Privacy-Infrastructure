# ==============================================================================
# PRIVGUARD AI - Default Helm Values
# Moon Sanctum Labs - Decode. Build. Evolve.
# ==============================================================================

global:
  environment: "production"
  debug: false
  failClosedMode: true
  maxRequestSizeBytes: 10485760
  corsAllowedOrigins:
    - "https://privguard.internal"
  imagePullSecrets: []
  appVersion: "0.1.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

backend:
  replicaCount: 2
  image:
    repository: "privguard/backend"
    tag: ""
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 8000
    annotations: {}
  strategy:
    maxSurge: "25%"
    maxUnavailable: 0
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

frontend:
  replicaCount: 2
  image:
    repository: "privguard/frontend"
    tag: ""
    pullPolicy: "IfNotPresent"
  service:
    type: "ClusterIP"
    port: 3000
    annotations: {}
  strategy:
    maxSurge: "25%"
    maxUnavailable: 0
  securityContext:
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

worker:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

migration:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

database:
  host: "postgres.database.svc.cluster.local"
  port: 5432
  database: "privguard_db"
  user: "privguard_app"
  migrationUser: "privguard_migrator"
  sslMode: "require"
  existingSecret: "privguard-database-credentials"
  migrationExistingSecret: "privguard-database-credentials"
  secretKeys:
    password: "postgres_password"
    migrationPassword: "migration_password"

redis:
  host: "redis.cache.svc.cluster.local"
  port: 6379
  db: 0
  ssl: false
  existingSecret: "privguard-redis-credentials"
  secretKeys:
    password: "redis_password"

secrets:
  existingSecret: "privguard-secrets"
  keys:
    masterKey: "privguard_master_key"
    adminApiKey: "privguard_admin_api_key"

externalLlm:
  baseUrl: "https://api.openai.com/v1"
  timeoutSeconds: 60.0
  existingSecret: ""
  secretKey: "api_key"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: "privguard.example.com"
      paths:
        - path: "/"
          pathType: "Prefix"
  tls: []

networkPolicy:
  enabled: true
  defaultDeny: true
  ingressController:
    namespaceSelector: {}
    podSelector: {}
  monitoring:
    enabled: false
    namespaceSelector: {}
  egress:
    databaseCidrs: []
    redisCidrs: []
    customEgressRules: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    additionalLabels: {}
