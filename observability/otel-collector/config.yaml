receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  batch:
    send_batch_size: 1024
    timeout: 1s

  # Zero-content privacy invariant: attribute scrubbing processor
  attributes:
    actions:
      - key: prompt
        action: delete
      - key: completion
        action: delete
      - key: message
        action: delete
      - key: content
        action: delete
      - key: memory
        action: delete
      - key: secret
        action: delete
      - key: password
        action: delete
      - key: token
        action: delete
      - key: api_key
        action: delete
      - key: authorization
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: privguard
    send_timestamps: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [debug]
