# ==============================================================================
# PRIVGUARD AI - Automated Security Scanning Workflow
# Moon Sanctum Labs - Decode. Build. Evolve.
# ==============================================================================

name: "Security Analysis"

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  push:
    branches: ["master", "main"]
    paths:
      - ".gitleaks.toml"
      - ".trivyignore"
      - "backend/requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "deploy/**"
  pull_request:
    branches: ["master", "main"]
    paths:
      - ".gitleaks.toml"
      - ".trivyignore"
      - "backend/requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/Dockerfile"
      - "frontend/Dockerfile"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Gitleaks Secret Scanning
  # ----------------------------------------------------------------------------
  gitleaks:
    name: "Gitleaks Secret Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout full git repository history"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: "Execute Gitleaks Scanner"
        uses: gitleaks/gitleaks-action@e85d996924d6736209b0b6910906be32ea8e05c8 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ".gitleaks.toml"

  # ----------------------------------------------------------------------------
  # Job 2: Trivy Vulnerability & Misconfiguration Scanner
  # ----------------------------------------------------------------------------
  trivy:
    name: "Trivy Security & Compliance Scanner"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: "Run Trivy Filesystem, Config & Manifest Scanner"
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
          trivyignores: ".trivyignore"

      - name: "Upload Trivy SARIF results to GitHub Security tab"
        uses: github/codeql-action/upload-sarif@dd7454955eb0c5a31a980753f7c46fcf8ae94a50 # v3.28.10
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

