[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "privguard-sdk"
version = "0.1.0"
description = "Official Python SDK for PRIVGUARD AI - Independent Security & Privacy Enforcement Layer for Agentic AI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Moon Sanctum Labs", email = "engineering@moonsanctum.internal" },
    { name = "Aniket Nandi" }
]
keywords = [
    "privguard",
    "ai-security",
    "privacy",
    "agentic-ai",
    "governance",
    "compliance",
    "llm-guardrails",
    "pii-redaction",
    "prompt-injection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "httpx>=0.27.0,<0.29.0",
    "pydantic>=2.6.0,<3.0.0",
    "cryptography>=42.0.0,<51.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "bandit>=1.7.0",
    "build>=1.2.0",
    "twine>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/moonsanctum/privguard-ai"
Documentation = "https://github.com/moonsanctum/privguard-ai/tree/master/docs"
Repository = "https://github.com/moonsanctum/privguard-ai"
Changelog = "https://github.com/moonsanctum/privguard-ai/blob/master/sdk/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/privguard_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml"
]
exclude = [
    "/.git",
    "/.github",
    "/tests",
    "/dist",
    "/.pytest_cache",
    "/.ruff_cache",
    "__pycache__"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in argument defaults
    "B904", # raise ... from err
    "B006", # mutable default argument
    "F401", # unused imports in __init__ re-exports
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
