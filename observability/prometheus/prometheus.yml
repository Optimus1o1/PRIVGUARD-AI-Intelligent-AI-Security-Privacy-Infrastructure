global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'rules/recording_rules.yml'
  - 'rules/alert_rules.yml'

scrape_configs:
  - job_name: 'privguard-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
    scrape_interval: 10s

  - job_name: 'privguard-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:8000']
    scrape_interval: 15s

  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s
