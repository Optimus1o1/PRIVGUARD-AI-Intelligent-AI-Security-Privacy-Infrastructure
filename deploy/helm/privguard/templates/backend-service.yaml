apiVersion: v1
kind: Service
metadata:
  name: {{ include "privguard.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "privguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port | default 8000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "privguard.selectorLabels" (dict "context" . "component" "backend") | nindent 4 }}

