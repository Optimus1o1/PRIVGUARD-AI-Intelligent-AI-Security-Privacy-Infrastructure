# ==============================================================================
# PRIVGUARD AI - Python SDK CI/CD Workflow
# Moon Sanctum Labs - Decode. Build. Evolve.
# ==============================================================================

name: "PRIVGUARD Python SDK CI"

on:
  push:
    branches: ["master", "main"]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Lint Matrix across supported Python versions
  # ----------------------------------------------------------------------------
  sdk-matrix-test:
    name: "SDK Test & Lint (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "sdk/python/pyproject.toml"

      - name: "Install build & test dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio build twine

      - name: "Install SDK in editable mode with dev dependencies"
        run: |
          pip install -e "./sdk/python[dev]"

      - name: "Linting check with Ruff"
        run: |
          ruff check sdk/python

      - name: "Formatting check with Ruff"
        run: |
          ruff format --check sdk/python

      - name: "Run SDK automated test suite"
        run: |
          pytest sdk/python/tests/ -v

  # ----------------------------------------------------------------------------
  # Job 2: Build & Validate Distribution Packages (Wheel + sdist)
  # ----------------------------------------------------------------------------
  sdk-package-build:
    name: "SDK Build & Package Validation"
    needs: [sdk-matrix-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: "Set up Python 3.12"
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: "Install build & inspection tools"
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: "Build sdist and wheel"
        run: |
          python -m build sdk/python

      - name: "Validate package metadata with twine"
        run: |
          twine check --strict sdk/python/dist/*

      - name: "Test clean wheel installation in clean environment"
        run: |
          python -m venv test_env
          ./test_env/bin/pip install --upgrade pip
          ./test_env/bin/pip install sdk/python/dist/*.whl
          ./test_env/bin/python -c "import privguard_sdk; print('Verified installed version:', privguard_sdk.__version__)"

      - name: "Archive built distributions"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8141 # v4.6.1
        with:
          name: privguard-sdk-dist
          path: sdk/python/dist/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 3: PyPI Trusted Publishing Readiness (OIDC / Dry-run gated)
  # ----------------------------------------------------------------------------
  sdk-release-check:
    name: "PyPI Trusted Publishing Readiness Check"
    needs: [sdk-package-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: "Verify OIDC environment readiness"
        run: |
          echo "PyPI Trusted Publishing workflow structure verified."
          echo "Target package: privguard-sdk"
          echo "Automated publication requires Git release tag (v*) and explicit authorization."

