# ==============================================================================
# PRIVGUARD AI - Production Environment Values
# ==============================================================================

global:
  environment: "production"
  debug: false
  failClosedMode: true
  maxRequestSizeBytes: 10485760
  corsAllowedOrigins:
    - "https://privguard.internal"

backend:
  replicaCount: 3
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2048Mi"
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

worker:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

database:
  sslMode: "verify-full"

ingress:
  enabled: true
  className: "caddy"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "privguard.internal"
      paths:
        - path: "/"
          pathType: "Prefix"
  tls:
    - secretName: "privguard-production-tls"
      hosts:
        - "privguard.internal"

networkPolicy:
  enabled: true
  defaultDeny: true

monitoring:
  serviceMonitor:
    enabled: true
    interval: "15s"
    scrapeTimeout: "10s"
